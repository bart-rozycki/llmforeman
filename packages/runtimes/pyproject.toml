[project]
name = "llmforeman-runtimes"
version = "0.0.0"
description = "LLMForeman local inference runtime integrations (includes the Ollama runtime)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "llmforeman-core",
    "ollama>=0.6.2",
    "pydantic>=2.7",
    "relprim>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmforeman_runtimes"]
