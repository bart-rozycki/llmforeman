[project]
name = "llmforeman-providers"
version = "0.0.0"
description = "LLMForeman cloud LLM provider integrations (boundary only; no SDKs yet)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "llmforeman-core",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmforeman_providers"]
