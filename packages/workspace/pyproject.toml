[project]
name = "llmforeman-workspace"
version = "0.0.0"
description = "LLMForeman local coding workspace infrastructure boundary (repository/filesystem access; no implementation yet)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["llmforeman-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmforeman_workspace"]
