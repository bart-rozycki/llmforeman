[project]
name = "llmforeman-cli"
version = "0.0.0"
description = "LLMForeman command-line interface (executable composition root for the local coding worker)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "llmforeman-core",
    "llmforeman-runtimes",
    "llmforeman-workspace",
    "llmforeman-orchestration",
]

[project.scripts]
llmforeman = "llmforeman_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmforeman_cli"]
